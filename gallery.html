<html >
<head>
    <title>Nepal Photo Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            color: #333;
        }

        header {
            background-color: #003893;
            color: white;
            text-align: center;
            padding: 15px;
        }

        nav {
            background-color: #dc143c;
            text-align: center;
            padding: 8px;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            font-weight: bold;
        }

        nav a.active {
            background-color: #003893;
            border-radius: 4px;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border: 1px solid #ddd;
        }

        /* Simple Image Grid */
        .photo-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }

        .photo-item {
            border: 1px solid #ccc;
            padding: 8px;
            background: #fff;
            text-align: center;
            width: 220px;
        }

        .photo-item img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        .photo-item p {
            margin: 8px 0 0 0;
            font-size: 0.9em;
            color: #555;
        }

        footer {
            text-align: center;
            padding: 15px;
            background-color: #222;
            color: white;
            margin-top: 30px;
            font-size: 0.85em;
        }
    </style>
</head>
<body>

    <header>
        <h1>Nepal Photo Gallery</h1>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="gallery.html" class="active">Gallery</a>
        <a href="facts.html">Facts & Info</a>
        <a href="survey.html">Survey</a>
    </nav>

    <div class="container">
        <h2>Photo Highlights</h2>

                <img src="everest.jpg" alt="Mount Everest">
                <p>Mount Everest</p>

                <img src="my_kathmandu.jpg" alt="Kathmandu Temple">
                <p>Kathmandu Valley</p>
        
                <img src="phewa.jpg" alt="Phewa Lake Pokhara">
                <p>Phewa Lake, Pokhara</p>
    
                <img src="himalaya.jpg" alt="Himalayan Valley">
                <p>Himalayan Mountain Range</p>
        
</body>
</html>
